[package]
name = "zing-daemon"
version = "0.1.5"
edition = "2021"
description = "Daemon mode for the zing downloader"
authors = ["Tharuk Renuja"]
license = "GPL-3.0-only"

[[bin]]
name = "zing-daemon"
path = "src/main.rs"

[package.metadata.deb]
depends = "libc6, libssl3"

[dependencies]
zing-core = { path = "../core" }
zing-ext = { path = "../ext" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time"] }
chrono = "0.4"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.9"
