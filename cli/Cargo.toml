[package.metadata.wix]
path-guid = "637329ae-96ef-4783-808f-1ea9b93ac8ae"
upgrade-guid = "9469988e-7729-41cc-bad7-f5f0debe607f"
license = "wix/License.rtf"
eula = "wix/License.rtf"

[package]
name = "zing"
version = "0.1.9"
edition = "2021"
description = "A modern HTTP downloader with segmented concurrent downloads"
authors = ["Tharuk Renuja"]
license = "GPL-3.0-only"

[package.metadata.deb]
copyright = "© 2026 Tharuk Renuja"
maintainer = "Tharuk Renuja"
section = "net"
depends = "libc6, libssl3"
assets = [
    ["target/release/zing", "/usr/bin/zing", "755"],
    ["target/release/zing-daemon", "/usr/bin/zing-daemon", "755"],
]
extended-description = """
A modern HTTP downloader with support for HTTP/1.1, HTTP/2, and HTTP/3.
Features include segmented concurrent downloads, daemon mode, and adaptive connection management.
"""

[package.metadata.bundle]
name = "zing"
identifier = "com.tharukrj.zing"
version = "0.1.9"
display-name = "zing"
short-version = "0.1.9"
long-version = "0.1.9"
frameworks = ["CoreFoundation", "Foundation"]

[[bin]]
name = "zing"
path = "src/main.rs"

[dependencies]
zing-core = { path = "../core" }
zing-ext = { path = "../ext" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "6"
indicatif = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "process"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
dialoguer = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
shellexpand = "3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
futures = "0.3"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
zing-tui = { path = "../tui", optional = true }

[features]
default = ["tui"]
tui = ["dep:zing-tui"]

