[package]
name = "rxcore"
version = "0.1.0"
edition = "2021"
description = "Core functionality for the rxdl downloader"
authors = ["Tharuk Renuja"]
license = "GPL-3.0-only"

[dependencies]
rxext = { path = "../rxext" }
tokio = { version = "1", features = ["sync", "time", "signal", "rt", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http3"] }
anyhow = "1"
rand = "0.8"
