[package.metadata.wix]
path-guid = "637329ae-96ef-4783-808f-1ea9b93ac8ae"
upgrade-guid = "9469988e-7729-41cc-bad7-f5f0debe607f"
license = false
eula = false

[package]
name = "rxdl"
version = "0.1.0"
edition = "2021"
description = "A modern HTTP downloader with segmented concurrent downloads"
authors = ["Tharuk Renuja"]
license = "GPL-3.0-only"

[package.metadata.deb]
copyright = "© 2026 Tharuk Renuja"
maintainer = "Tharuk Renuja"
section = "net"
depends = "libc6, libssl3"
assets = [
    ["target/release/rxdl", "/usr/bin/rxdl", "755"]
]
extended-description = """
A modern HTTP downloader with support for HTTP/1.1, HTTP/2, and HTTP/3.
Features include segmented concurrent downloads, daemon mode, and adaptive connection management.
"""

[package.metadata.bundle]
name = "rxdl"
identifier = "com.tharukrj.rxdl"
version = "0.1.0"
display-name = "rxdl"
short-version = "0.1.0"
long-version = "0.1.0"
frameworks = ["CoreFoundation", "Foundation"]

[[bin]]
name = "rxdl"
path = "src/main.rs"

[dependencies]
rxcore = { path = "../rxcore" }
rxext = { path = "../rxext" }
clap = { version = "4", features = ["derive"] }
dirs = "6"
indicatif = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
shellexpand = "3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

