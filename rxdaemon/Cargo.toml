[package]
name = "rxdaemon"
version = "0.1.0"
edition = "2021"
description = "Daemon mode for the rxdl downloader"
authors = ["Tharuk Renuja"]
license = "GPL-3.0-only"

[[bin]]
name = "rxdaemon"
path = "src/main.rs"

[dependencies]
rxcore = { path = "../rxcore" }
rxext = { path = "../rxext" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
