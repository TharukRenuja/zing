name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --workspace
          - os: macos-latest
            args: --workspace
          - os: windows-latest
            args: -p zing -p zing-core -p zing-ext
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.args }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  release:
    name: Build & package (${{ matrix.target }})
    needs: [test, lint]
    if: github.ref_type == 'tag'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            pkgs: -p zing -p zing-daemon
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            pkgs: -p zing
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
            pkgs: -p zing -p zing-daemon
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            pkgs: -p zing -p zing-daemon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release ${{ matrix.pkgs }}

      - name: Build .deb (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb
          cargo deb -p zing

      - name: Prepare archive (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          mkdir -p staging/zing
          cp target/release/zing staging/zing/
          test -f target/release/zing-daemon && cp target/release/zing-daemon staging/zing/ || true
          cp README.md LICENSE staging/zing/ 2>/dev/null || true
          tar czf zing-${{ matrix.target }}.tar.gz -C staging zing

      - name: Prepare archive (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          mkdir -p staging/zing
          cp target/release/zing.exe staging/zing/
          cp README.md LICENSE staging/zing/ 2>/dev/null || true
          7z a zing-${{ matrix.target }}.zip ./staging/zing/*

      - name: Upload artifacts (archive)
        uses: actions/upload-artifact@v4
        with:
          name: zing-${{ matrix.target }}
          path: zing-${{ matrix.target }}.*

      - name: Upload .deb artifact
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: zing-${{ matrix.target }}-deb
          path: target/debian/*.deb

      - name: Upload .deb to release
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v2
        with:
          files: target/debian/*.deb

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: zing-${{ matrix.target }}.*
          generate_release_notes: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
