name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --workspace
          - os: macos-latest
            args: --workspace
          - os: windows-latest
            args: --workspace
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.args }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  release:
    name: Package (${{ matrix.suffix }})
    needs: [test, lint]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-linux
            pkgs: -p zing -p zing-daemon
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: aarch64-linux
            pkgs: -p zing -p zing-daemon
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-windows
            pkgs: -p zing -p zing-daemon
            ext: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: aarch64-windows
            pkgs: -p zing -p zing-daemon
            ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: x86_64-mac
            pkgs: -p zing -p zing-daemon
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64-mac
            pkgs: -p zing -p zing-daemon
            ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.pkgs }}

      - name: Prepare archive (Unix tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          TAG=${{ github.ref_name }}
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p staging
          cp "$BIN_DIR/zing" "staging/zing-$TAG-${{ matrix.suffix }}"
          test -f "$BIN_DIR/zing-daemon" && \
            cp "$BIN_DIR/zing-daemon" "staging/zing-daemon-$TAG-${{ matrix.suffix }}" || true
          if [[ "${{ matrix.suffix }}" == *mac ]]; then
            archive_name="zing-$TAG-${{ matrix.suffix }}-update.tar.gz"
          else
            archive_name="zing-$TAG-${{ matrix.suffix }}.tar.gz"
          fi
          tar czf "$archive_name" -C staging .

      - name: Prepare .dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          TAG=${{ github.ref_name }}
          BIN_DIR="target/${{ matrix.target }}/release"
          mkdir -p staging
          cp "$BIN_DIR/zing" "staging/zing"
          test -f "$BIN_DIR/zing-daemon" && \
            cp "$BIN_DIR/zing-daemon" "staging/zing-daemon" || true
          hdiutil create -volname "zing $TAG" -srcfolder staging -ov -format UDZO \
            "zing-$TAG-${{ matrix.suffix }}.dmg"

      - name: Prepare .zip (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $binDir = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path staging
          Copy-Item "$binDir/zing.exe" staging/zing.exe
          if (Test-Path "$binDir/zing-daemon.exe") {
            Copy-Item "$binDir/zing-daemon.exe" staging/zing-daemon.exe
          }
          Compress-Archive -Path staging/* -DestinationPath "zing-$tag-${{ matrix.suffix }}-update.zip"

      - name: Build NSIS installer (Windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          (Get-Content packaging/nsis/installer.nsi) -replace '0\.[0-9]+\.[0-9]+', $version | Set-Content packaging/nsis/installer.nsi
          $stagingDir = Join-Path $pwd "staging"
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DSOURCE_DIR=$stagingDir" "/DARCH_SUFFIX=${{ matrix.suffix }}" packaging/nsis/installer.nsi
          Move-Item "packaging/nsis/zing-$version-${{ matrix.suffix }}-installer.exe" "zing-$tag-${{ matrix.suffix }}-installer.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zing-${{ matrix.suffix }}
          path: zing-${{ github.ref_name }}-*

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: zing-${{ github.ref_name }}-*
          generate_release_notes: ${{ matrix.suffix == 'x86_64-linux' }}
