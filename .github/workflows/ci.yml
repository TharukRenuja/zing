name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --workspace
          - os: macos-latest
            args: --workspace
          - os: windows-latest
            args: -p zing -p zing-core -p zing-ext
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test ${{ matrix.args }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace -- -D warnings

  release:
    name: Package (${{ matrix.suffix }})
    needs: [test, lint]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: x86_64-linux
            pkgs: -p zing -p zing-daemon
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: aarch64-linux
            pkgs: -p zing -p zing-daemon
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: x86_64-windows
            pkgs: -p zing
            ext: exe
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: aarch64-windows
            pkgs: -p zing
            ext: exe
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: aarch64-mac
            pkgs: -p zing -p zing-daemon
            ext: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release ${{ matrix.pkgs }}

      - name: Prepare archive (Unix tar.gz)
        if: matrix.ext == 'tar.gz'
        run: |
          TAG=${{ github.ref_name }}
          mkdir -p staging
          cp target/release/zing "staging/zing-$TAG-${{ matrix.suffix }}"
          test -f target/release/zing-daemon && \
            cp target/release/zing-daemon "staging/zing-daemon-$TAG-${{ matrix.suffix }}" || true
          tar czf "zing-$TAG-${{ matrix.suffix }}.tar.gz" -C staging .

      - name: Prepare .dmg (macOS)
        if: matrix.ext == 'dmg'
        run: |
          TAG=${{ github.ref_name }}
          mkdir -p staging
          cp target/release/zing "staging/zing"
          test -f target/release/zing-daemon && \
            cp target/release/zing-daemon "staging/zing-daemon" || true
          hdiutil create -volname "zing $TAG" -srcfolder staging -ov -format UDZO \
            "zing-$TAG-${{ matrix.suffix }}.dmg"

      - name: Prepare .exe (Windows)
        if: matrix.ext == 'exe'
        shell: bash
        run: |
          TAG=${{ github.ref_name }}
          cp target/release/zing.exe "zing-$TAG-${{ matrix.suffix }}.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zing-${{ matrix.suffix }}
          path: zing-${{ github.ref_name }}-*

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: zing-${{ github.ref_name }}-*
          generate_release_notes: ${{ matrix.suffix == 'x86_64-linux' }}
