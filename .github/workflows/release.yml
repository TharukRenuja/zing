name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install cargo tools
        run: |
          cargo install cargo-deb || echo "Failed to install cargo-deb"
          cargo install cargo-generate-rpm || echo "Failed to install cargo-generate-rpm"

      - name: Build and Package
        run: |
          cargo build --release
          cargo deb
          cargo generate-rpm

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/release/rxdl artifacts/rxdl-linux-amd64
          cp target/debian/*.deb artifacts/ || true
          cp target/generate-rpm/*.rpm artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate GUIDs and update WIX file
        shell: pwsh
        run: |
          $upgradeGuid = [guid]::NewGuid().ToString()
          $componentGuid = [guid]::NewGuid().ToString()
          $uninstallGuid = [guid]::NewGuid().ToString()
          $content = Get-Content "wix/rxdl.wxs"
          $content = $content -replace 'Manufacturer="YourName"', 'Manufacturer="TharukRenuja"'
          $content = $content -replace 'UpgradeCode="PUT-GUID-HERE"', "UpgradeCode='" + $upgradeGuid + "'"
          $content = $content -replace 'Guid="PUT-GUID-HERE"', "Guid='" + $componentGuid + "'"
          $content = $content -replace 'Guid="PUT-GUID-HERE"', "Guid='" + $uninstallGuid + "'"
          $content = $content -replace 'Key=\"Software\\\\YourName\\\\rxdl\"', 'Key="Software\\TharukRenuja\\rxdl"'
          $content | Set-Content "wix/rxdl.wxs"
          echo "UPGRADE_GUID=$upgradeGuid" >> $env:GITHUB_ENV
          echo "COMPONENT_GUID=$componentGuid" >> $env:GITHUB_ENV
          echo "UNINSTALL_GUID=$uninstallGuid" >> $env:GITHUB_ENV

      - name: Install cargo-wix
        run: cargo install cargo-wix || echo "Failed to install cargo-wix"

      - name: Build and Package
        run: cargo wix --nocapture --target-dir target/wix

      - name: Prepare artifacts
        run: |
          mkdir artifacts
          Copy-Item target\wix\*.msi artifacts\ || echo "No MSI package found"
          Copy-Item target\release\rxdl.exe artifacts\rxdl-windows-amd64.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-bundle
        run: cargo install cargo-bundle || echo "Failed to install cargo-bundle"

      - name: Build and Bundle
        run: cargo bundle --release

      - name: Prepare artifacts
        run: |
          mkdir artifacts
          cp target/release/bundle/osx/rxdl.app artifacts/
          cp target/release/rxdl artifacts/rxdl-macos-amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/linux-artifacts/*
            artifacts/windows-artifacts/*
            artifacts/macos-artifacts/*
            LICENSE
          generate_release_notes: true