[package]
name = "zing-gui"
version = "0.2.6"
edition = "2024"
description = "Standalone desktop GUI for the zing downloader (IDM-style)"
authors = ["Tharuk Renuja"]
license = "GPL-3.0-only"

[[bin]]
name = "zing-gui"
path = "src/main.rs"

[lib]
name = "zing_gui"
path = "src/lib.rs"

[dependencies]
zing-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
color-eyre = "0.6"
dirs = "6"
notify-rust = "4.11"
open = "5"
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }
