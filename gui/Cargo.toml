[package]
name = "zing-gui"
version = "0.2.3"
edition = "2021"
description = "Desktop GUI for the zing downloader"
authors = ["Tharuk Renuja"]
license = "GPL-3.0-only"

[dependencies]
zing-core = { path = "../core" }
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["syntect"] }
egui_plot = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
