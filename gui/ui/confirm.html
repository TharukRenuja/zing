<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zing - Confirm Download</title>
  <link rel="stylesheet" href="css/theme.css">
  <script>
    (function() {
      var t = localStorage.getItem('zing-theme');
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Drag region (title bar replacement) ── */
    .drag-bar {
      -webkit-app-region: drag;
      app-region: drag;
      height: 32px;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 100;
    }

    .confirm-wrap {
      padding: 44px 24px 20px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .confirm-header {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-weak);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }

    #pending-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #pending-list::-webkit-scrollbar { width: 4px; }
    #pending-list::-webkit-scrollbar-track { background: transparent; }
    #pending-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .confirm-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .confirm-filename {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }

    .confirm-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .confirm-meta-row {
      font-size: 12px;
      color: var(--text-weak);
      display: flex;
      gap: 6px;
      align-items: baseline;
    }

    .confirm-meta-row .label {
      color: var(--text-faint);
      flex-shrink: 0;
    }

    .confirm-meta-row .value {
      word-break: break-all;
      min-width: 0;
    }

    .confirm-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .confirm-actions button {
      flex: 1;
      padding: 8px 0;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--panel-elevated);
      color: var(--text);
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
      text-align: center;
    }

    .confirm-actions button:hover {
      background: var(--panel-hover);
      border-color: var(--border-strong);
    }

    .confirm-actions .btn-confirm {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .confirm-actions .btn-confirm:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .confirm-actions .btn-schedule {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .confirm-actions .btn-schedule:hover {
      background: var(--panel-elevated);
      border-color: var(--border);
    }

    #empty-msg {
      color: var(--text-faint);
      font-size: 13px;
      text-align: center;
      padding: 40px 0;
    }
  </style>
</head>
<body>
  <div class="drag-bar"></div>
  <div class="confirm-wrap">
    <div class="confirm-header">Pending Downloads</div>
    <div id="pending-list"></div>
    <div id="empty-msg" style="display:none;">No pending downloads.</div>
  </div>

  <script src="js/confirm.js"></script>
</body>
</html>
