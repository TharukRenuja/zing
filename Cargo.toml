[workspace]
resolver = "2"
members = ["core", "cli", "daemon", "tui"]
default-members = ["cli"]

# Single source for the version. `env!("CARGO_PKG_VERSION")` expands per crate,
# so anything that reports a version from two different crates — the CLI's
# `--version` and core's User-Agent, for instance — needs these to agree.
[workspace.package]
version = "0.2.7"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
opt-level = 3

[workspace.metadata.deb]
copyright = "© 2026 Tharuk Renuja"
