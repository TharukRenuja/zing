[package]
name = "zing-core"
version.workspace = true
edition = "2021"
description = "Core functionality for the zing downloader"
authors = ["Tharuk Renuja"]
license = "AGPL-3.0"

[dependencies]
sha2 = "0.10"
sha-1 = "0.10"
md-5 = "0.10"
quick-xml = "0.36"
tokio = { version = "1", features = ["sync", "time", "signal", "rt", "fs", "io-util", "io-std", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
tracing = "0.1"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies"] }
anyhow = "1"
rand = "0.8"
cookie_store = "0.22"
cookie = "0.18"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
